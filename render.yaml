# Blueprint de planejamento. O deploy permanece manual e desativado nesta sprint.
services:
  - type: web
    name: aulou-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENVIRONMENT
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
  - type: worker
    name: aulou-worker
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENVIRONMENT
        value: production
      - key: WORKER_ENVIRONMENT
        value: production
      - key: WORKER_QUEUES
        value: file-extraction,notification
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WORKER_POLL_INTERVAL_MS
        value: 10000
      - key: WORKER_BATCH_SIZE
        value: 10
